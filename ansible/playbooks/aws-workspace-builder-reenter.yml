# =========================================================================================== #
# File: 'ansible/playbooks/aws-workspace-builder-reenter.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# RESUMES A BUILD THAT DIED AFTER THE SEAL. Plays 4 to 6 of the build take the launch key away and
# put a new way in through the domain, and between those two moments the guest is reachable by
# nothing this repository holds. A run interrupted there -- a failed task, a dropped VPN, an
# operator's laptop sleeping through the LAPS wait -- cannot simply be started again: the build
# opens by connecting over SSH, and there is no SSH to connect over.
#
# This playbook is plays 5 through 8, and nothing else: read the escrow, re-enter over the
# listener the domain delivers, converge, record. It is LIFTED from the build playbook rather
# than rewritten, so the recovery path cannot drift away from the path it recovers.
#
# WHAT IT NEEDS THAT THE BUILD DID NOT. The build learns the machine's directory name in play 4,
# from the guest, while SSH still works. A recovery run has no play 4 and no way to ask, so the
# name is supplied:
#
#   -e workspace_identity=TCNAW-WSB01
#
# It is the sAMAccountName without the trailing dollar -- what the directory calls the machine,
# which after the Server 2022 bootstrap renames it is NOT the inventory hostname.
#
# WHEN NOT TO USE IT. If the guest still answers on port 22, the build playbook is the right
# thing to run: it is idempotent, and it re-proves everything this one skips.
#
# =========================================================================================== #
---
#region ------ [ Play: The Contract A Recovery Still Has ] ------------------------------------ #

- name: 'PLAY | Validate The Recovery Contract'
  hosts: 'localhost'
  tasks:

    - name: 'RECOVERY | Require The Name The Directory Knows The Guest By'
      ansible.builtin.assert:
        fail_msg: >-
          This playbook resumes a build whose guest is already sealed, so it cannot ask the guest
          what it is called. Pass the name the DIRECTORY knows it by -- the sAMAccountName
          without the trailing '$', which after the bootstrap rename is not the inventory
          hostname: -e workspace_identity=TCNAW-WSB01
        quiet: true
        that:
          - workspace_identity is defined
          - workspace_identity is match('^[A-Za-z0-9][A-Za-z0-9-]{0,14}$')

    - name: 'RECOVERY | Require The Domain Controller And The Guest'
      ansible.builtin.assert:
        fail_msg: >-
          A recovery reads the escrow from a domain controller and converges the guest, so both
          inventories must be in scope:
          -i ansible/inventory/aws_ec2.yml -i ansible/inventory/domain_controllers.yml
        quiet: true
        that:
          - groups['domain_controllers'] | default([]) | length >= 1
          - groups['workspace_servers'] | default([]) | length >= 1

#endregion --- [ Play: The Contract A Recovery Still Has ] ------------------------------------ #

#region ------ [ Play: Read The Escrowed Credential ] ----------------------------------------- #
# ON A DOMAIN CONTROLLER, because that is where the credential is. The guest is not contacted by
# this play and does not have to be reachable -- which is the entire reason the read happens here
# rather than there.
#
# This is also the play that waits. Nothing triggers the escrow: the LAPS policy is processed on
# the guest's own background cycle, so the credential appears when it appears. The role's budget
# is two hours, which covers a Group Policy refresh interval plus the processing that follows.

- name: 'PLAY | Read The Escrowed LAPS Credential From The Domain Controller'
  hosts: 'domain_controllers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: LAPS Credential ] ------------------------------------------------- #
    # 'identity' is the name play 4 wrote down, carried across in hostvars. It is the AMI-
    # generated machine name, not the inventory hostname, because that is what the join
    # registered in the directory.
    #
    # The role publishes the credential through its registered result and never logs it. The play
    # below reads it out of hostvars on this host.
    - role: 'laps_credential'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        laps_credential:
          identity: "{{ workspace_identity }}"
          # WHEN THIS MACHINE CAME INTO EXISTENCE, which is what makes an older escrow provably
          # somebody else's. An escrow on a reused computer object was written for the previous
          # occupant, necessarily before this instance launched.
          #
          # It is the INSTANCE's launch time rather than the moment this run started, and the
          # difference matters: a baseline taken per run would reject the machine's own valid
          # escrow on every re-run -- the credential was written during the first run, before the
          # second one began -- and the build would sit out its whole budget waiting for a
          # rotation that is not coming, because Windows LAPS does not rotate an unexpired
          # password. Launch time is stable across re-runs, which is the property this needs.
          #
          # Normalised to ISO 8601 because the inventory hands this over as a DATETIME OBJECT,
          # not a string: templating it yields '2026-09-02 18:28:18+00:00', with a space where
          # ISO puts a T. Both parse in PowerShell, but only one is worth writing down.
          not_before: >-
            {{ (hostvars[groups['workspace_servers'] | first]['aws_launch_time'] | string)
               | regex_replace(' ', 'T') }}
    #endregion --- [ Roles: LAPS Credential ] ------------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Read The Escrowed Credential ] ----------------------------------------- #

#region ------ [ Play: Re-Enter As A WorkSpace Administrator ] -------------------------------- #
# The one play that connects the way a real WorkSpace is connected to: WinRM over HTTP on 5985 --
# the listener Group Policy delivers -- NTLM, as the local Administrator whose password the
# directory just handed us. The connection variables are set HERE rather than in the inventory
# because they are true of this play and no other: the same host is reached over SSH in every play
# before and after it, and the inventory's WinRM leg is the framework's HTTPS readiness path.

- name: 'PLAY | Re-Enter The Stand-In Over WinRM With The LAPS Credential'
  hosts: 'workspace_servers'
  any_errors_fatal: true

  #region ------ [ Vars: The WorkSpace Transport ] -------------------------------------------- #
  vars:
    __laps_escrow__: >-
      {{ hostvars[groups['domain_controllers'] | first]['__laps_credential_read__'].result }}

    ansible_connection: 'winrm'
    ansible_port: 5985
    # HTTP is the wire, not the security. The listener the domain delivers is the HTTP one, and
    # nothing in a WorkSpace issues a certificate for an HTTPS one; what protects the session is
    # the client sealing every message under NTLM -- 'always' refuses to fall back to plaintext if
    # the negotiation cannot seal, so a listener that would accept unencrypted traffic is never
    # spoken to that way. It is the same protection the service's own AllowUnencrypted=false
    # demands, from the other end.
    ansible_winrm_scheme: 'http'
    ansible_winrm_transport: 'ntlm'
    ansible_winrm_message_encryption: 'always'
    # The winrm plugin expects cmd and warns when handed powershell, whatever os_bootstrap did to
    # OpenSSH's DefaultShell -- that setting is SSH's, and this is not SSH.
    ansible_shell_type: 'cmd'
    # The account LAPS actually manages, as the escrow names it, rather than an assumption about
    # which account that is. The fallback is the built-in Administrator, which is what Windows
    # LAPS manages unless a policy names another.
    ansible_user: "{{ __laps_escrow__.account | default('Administrator', true) }}"
    ansible_password: "{{ __laps_escrow__.password }}"

    # PLAY VARS REACH DELEGATED TASKS TOO. A task that delegates to the controller is still a
    # task of this play, and these variables outrank the implicit localhost's own
    # ansible_connection=local -- so without help it would try to speak NTLM to localhost:5985
    # and drive a Linux controller through the cmd shell plugin. Task vars are the one scope that
    # outranks play vars, so every task in this play that delegates to the controller -- the two
    # SEAL pre-tasks below and the two controller-side tasks inside openssh_server -- pins its
    # connection back to local and its shell back to sh, in its own vars.
  #endregion --- [ Vars: The WorkSpace Transport ] -------------------------------------------- #

  #region ------ [ Pre-Tasks: Prove The Seal, Then Forget The Old Host Key ] ------------------ #
  pre_tasks:

    # THE PROOF THAT THE SEAL TOOK. workspace_baseline closed port 22 and handed the OpenSSH
    # uninstall to the Task Scheduler on a delay; this is where the run finds out whether that
    # actually happened. It is the same thing a person would check, checked from the same place --
    # the controller, which is the machine whose access was supposed to have been revoked.
    #
    # Failing here means the host is still reachable by the launch key, which makes the rest of
    # the run prove nothing: it would be an ordinary SSH build wearing a WinRM detour.
    # THE BUILD PROVES THE SEAL HERE; A RECOVERY MUST NOT. In the build this play opens by waiting
    # for port 22 to fall silent, because a run that re-entered over a still-open SSH port would
    # have proven an ordinary SSH build rather than the WorkSpace credential path. That is a
    # statement about the BUILD's evidence, and it is not a precondition for getting back in.
    #
    # A recovery cannot require it. The failures worth recovering from fall on both sides of the
    # re-entry -- one during the LAPS wait leaves the guest sealed, one during the catalogue
    # leaves it perfectly reachable -- and a playbook that only worked in the first case would be
    # useless in the second, which is the case it was written during. WinRM is used either way,
    # because the listener the domain delivers is there either way.

    # Removing the OpenSSH capability is entitled to take C:\ProgramData\ssh with it, and a host
    # key regenerated on re-install is a DIFFERENT key for the same address. The controller
    # connects with StrictHostKeyChecking=accept-new, which accepts a host it has never seen and
    # refuses one whose key changed -- so the plays after this one would fail to connect, for a
    # reason that looks nothing like the cause.
    #
    # Forgetting the entry is correct rather than merely convenient: this address belongs to an
    # instance created for this run and destroyed at the end of it, so there is no continuity for
    # a pinned key to protect.
    - name: 'SEAL | Forget The Host Key From Before The Seal'
      changed_when: false
      delegate_to: 'localhost'
      vars:
        ansible_connection: 'local'
        ansible_shell_type: 'sh'
      when: (state | default('present') | string | lower | trim) != 'absent'

      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        state: 'absent'

  #endregion --- [ Pre-Tasks: Prove The Seal, Then Forget The Old Host Key ] ------------------ #

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Host Readiness ] -------------------------------------------------- #
    # Over WinRM this time. The port checks above prove sockets; this proves the CONNECTION --
    # that the LAPS credential authenticates, that NTLM completes, and that a command runs. A
    # password that is correct but refused (a policy denying local administrators a network logon)
    # surfaces here, named, rather than as a confusing failure inside the next role.
    #
    # Gated with the role below it: on teardown nothing was sealed, so there is no WinRM listener
    # to reach and no escrowed credential to reach it with.
    - role: 'host_readiness'
      when: (state | default('present') | string | lower | trim) != 'absent'
    #endregion --- [ Roles: Host Readiness ] -------------------------------------------------- #

    #region ------ [ Roles: OpenSSH Server ] -------------------------------------------------- #
    # Gives the transport back: proves the LAPS logon is elevated and may run a batch job, carries
    # the OpenSSH server capability's payload over this session and installs it with Windows
    # Update forbidden as a source, installs the operator's PUBLIC key -- fetched by the
    # controller from the deployment account's ansible bucket and verified against the digest the
    # role pins, the same way the join secret above reached domain_member -- with the ACL sshd
    # insists on, starts the service and opens the port. A real WorkSpace was never launched with
    # a key pair, so nothing on the guest's side of the session can say which key to restore; the
    # bucket the build already trusts is where the answer lives.
    #
    # The role defaults everything except two site choices: where an operator keeps the Features
    # on Demand cab comes from the openssh_payload extra-var play 1 already required, and the
    # bucket is the deployment account's, derived from the extra-var play 1 required. Nothing else
    # is passed -- see os_bootstrap above for why a stray role param is worse than none.
    - role: 'openssh_server'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        openssh_server:
          authorized_key:
            bucket: "{{ aws_account_id }}-ansible"
          capability:
            payload_path: "{{ openssh_payload }}"
    #endregion --- [ Roles: OpenSSH Server ] -------------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Re-Enter As A WorkSpace Administrator ] -------------------------------- #

#region ------ [ Play: Converge The Guest ] --------------------------------------------------- #
# Back on SSH, and back to being an ordinary fleet host. Nothing below this line knows or cares
# that the transport was taken away and given back; that is the measure of whether the
# replication worked.
#
# host_readiness and os_bootstrap run again because the transport underneath them is new: the
# connection has to be proved once more, and OpenSSH's DefaultShell is a value the capability took
# with it when it was uninstalled.

- name: 'PLAY | Converge The Guest Over The Restored Transport'
  hosts: 'workspace_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Host Readiness ] -------------------------------------------------- #
    - role: 'host_readiness'
    #endregion --- [ Roles: Host Readiness ] -------------------------------------------------- #

    #region ------ [ Roles: OS Bootstrap ] ---------------------------------------------------- #
    # Pass it NO vars: role params outrank the connection scoping it relies on, and a stray one
    # silently re-breaks the pre-flip stage.
    - role: 'os_bootstrap'
    #endregion --- [ Roles: OS Bootstrap ] ---------------------------------------------------- #

    #region ------ [ Roles: Windows Disk Manager ] -------------------------------------------- #
    # `function` names the EBS volume's Function tag from terraform/aws.tfvars, and the role
    # resolves it to the attached disk itself -- a volume id only exists after apply. D: is the
    # contract this play publishes: it is the stand-in for the WorkSpace's user volume, the disk
    # a Rebuild preserves while C: is replaced.
    - role: 'windows_disk_manager'
      vars:
        windows_disk_manager:
          platform: 'aws'
          disks:
            - function: 'WSUSERVOL'
              drive_letter: 'D'
              label: 'WSUSERVOL'
              allocation_unit: 4096
    #endregion --- [ Roles: Windows Disk Manager ] -------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Converge The Guest ] --------------------------------------------------- #

#region ------ [ Play: The WorkSpace Stand-In ] ----------------------------------------------- #
# Records what this host stands in for. The production flow ends holding a WorkSpace id, a
# ComputerName and a backing instance id read from the WorkSpaces API; the stand-in publishes the
# same identity from the EC2 side onto the guest, so everything built on this image can read one
# manifest whichever path produced the machine.
#
# The application roles land HERE as their artifacts land in the application repository bucket:
# one role per catalog product, each carrying its own pinned version and digest, appended below
# workspace_builder in install order.

- name: 'PLAY | Record The WorkSpace Stand-In Identity'
  hosts: 'workspace_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Workspace Builder ] ----------------------------------------------- #
    # 'workspace' is the PRODUCTION target this host stands in for -- the directory, bundle and
    # user the reference flow feeds to create-workspaces. 'identity' is what this stand-in
    # actually is, read from the run's own inventory. The role writes both to one manifest and
    # proves the round trip, so the mapping is a fact on the machine rather than lore in a repo.
    #
    # computer_name is the name the DIRECTORY knows, read from the guest in play 4 -- the same
    # value the LAPS read waited on. The inventory hostname is the Name tag, which is not what an
    # unrenamed EC2 Windows instance calls itself, and a manifest that disagreed with Active
    # Directory would be worse than no manifest.
    - role: 'workspace_builder'
      vars:
        workspace_builder:
          workspace:
            directory_id: 'd-b567216b54'
            bundle_id: 'wsb-39nl99v7l'
            user_name: 'Administrator'
          identity:
            workspace_id: "{{ aws_instance_id }}"
            computer_name: "{{ ansible_facts.netbios_name | default(workspace_identity) }}"
            image_id: "{{ aws_image_id }}"
            private_ip: "{{ aws_private_ip_address }}"
    #endregion --- [ Roles: Workspace Builder ] ----------------------------------------------- #

    #region ------ [ Roles: AWS CFN Bootstrap ] ----------------------------------------------- #
    # The artifact is the one AWS documents, and it is an EXE: the .msi under the same prefix is
    # the abandoned Python-2 line at 1.4.36, older than the AMI carries. The AMI already ships
    # 2.0.40, so this role reads and proves rather than installs on a current image.
    - role: 'aws_cfn_bootstrap'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        aws_cfn_bootstrap:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '2.0.40.0'
            sha256: 'ee40b29e016a7bcb4f1876ea5ec235bcedc8f30363893bb5c9ba2c84a01a7b08'
    #endregion --- [ Roles: AWS CFN Bootstrap ] ----------------------------------------------- #

    #region ------ [ Roles: Splunk Universal Forwarder ] -------------------------------------- #
    # LAUNCHSPLUNK=0 in the role's defaults is the imaging decision: the forwarder is installed
    # but never started here, so no per-instance identity is generated to be captured. It starts
    # on the desktop, where generating one is right. The deployment server is site-specific and
    # is supplied at runtime, not baked into an image.
    - role: 'splunk_universalforwarder'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        splunk_universalforwarder:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '10.4.2.0'
            sha256: '5ff1869fd1417d8af79e3a1b74635ae1d69ad7002563b9cad5d517023a58cb00'
    #endregion --- [ Roles: Splunk Universal Forwarder ] -------------------------------------- #

    #region ------ [ Roles: Amazon CloudWatch Agent ] ----------------------------------------- #
    # The pin is the MSI's own ProductVersion, not the vendor's published build string: this
    # product publishes '1.300072.0b1766' and registers 1.4.37928, and the role compares against
    # Add/Remove Programs. Read from the artifact rather than guessed.
    - role: 'amazon_cloudwatch_agent'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        amazon_cloudwatch_agent:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '1.4.37928.0'
            sha256: '74925ab35d7803a699c05556b4d9862d32f6a6c28537f4104bdc83cab2671c36'
    #endregion --- [ Roles: Amazon CloudWatch Agent ] ----------------------------------------- #

    #region ------ [ Roles: Amazon SSM Agent ] ------------------------------------------------ #
    # The AMI already carries this agent, so on a current image the role reads, finds the pin
    # satisfied and installs nothing. It is listed because the image must STATE what it carries:
    # a future AMI without it converges to the same place. Its 'clean' state -- disabling the
    # service, which image capture requires -- lives in aws-workspace-builder-clean.yml.
    - role: 'amazon_ssm_agent'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        amazon_ssm_agent:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '3.3.4851.0'
            sha256: '964ef39b74aedf43ee40c1f9aebd7b4f2236e4a7802e5bb17a93289821ba3999'
    #endregion --- [ Roles: Amazon SSM Agent ] ------------------------------------------------ #

    #region ------ [ Roles: Workspace Network Baseline ] -------------------------------------- #
    # The image's network posture, not a product: the guest firewall openings AWS requires of a
    # WorkSpace (management channel and both streaming protocols, admitted from the management
    # network range alone). Every value is an AWS-documented constant, so the role is invoked
    # bare; see its defaults for the rationale and the BYOL-checker connection.
    - role: 'workspace_network_baseline'
      when: (state | default('present') | string | lower | trim) != 'absent'
    #endregion --- [ Roles: Workspace Network Baseline ] -------------------------------------- #

    #region ------ [ Roles: Google Chrome ] --------------------------------------------------- #
    # First catalog product, and the pattern's exemplar (see the role's defaults/main.yml). The
    # pins say exactly what the image carries: version and sha256 move TOGETHER when a new
    # artifact lands at the versioned key in the application repository. Gated like the seal
    # roles: a host being torn down does not need software converged on the way out.
    - role: 'google_chrome'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        google_chrome:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '152.0.7977.76'
            sha256: 'b62295897570e665b67bdd7254bc46acb00de8026dc93465b4df781a2c10ca12'
          # The baseline this image bakes in. Written as machine state so it survives capture;
          # a production GPO managing the same product later still wins on precedence.
          policy:
            overlays: [ 'stig' ]
    #endregion --- [ Roles: Google Chrome ] --------------------------------------------------- #

    #region ------ [ Roles: Seven Zip ] ----------------------------------------------------------------- #
    - role: 'seven_zip'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        seven_zip:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '26.02.00.0'
            sha256: 'db407a4f6d4999e5c7bc00ce8a882be94717b56e7fa68140fe3f12605d91643e'
    #endregion --- [ Roles: Seven Zip ] ----------------------------------------------------------------- #

    #region ------ [ Roles: Powershell 7 ] -------------------------------------------------------------- #
    - role: 'powershell_7'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        powershell_7:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '7.6.5.0'
            sha256: '3a87c24e044ec792047d734c841917ee4323a535e25f645ae6c33141a35fca8d'
    #endregion --- [ Roles: Powershell 7 ] -------------------------------------------------------------- #

    #region ------ [ Roles: AWS Cli V2 ] ---------------------------------------------------------------- #
    - role: 'aws_cli_v2'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        aws_cli_v2:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '2.36.31.0'
            sha256: 'f111c93d158f7c55ed3bf6f2ee9e031fb75b1fce3eccc604519ffdea2810c1fa'
    #endregion --- [ Roles: AWS Cli V2 ] ---------------------------------------------------------------- #

    # ONE NODE, AND THE EXACT PIN IS WHAT ENFORCES IT. Every Node.js MSI registers the same
    # Add/Remove Programs name and they share an upgrade code, so a second version replaces the
    # first rather than joining it. Naming the unwanted versions as 'absent' looked like the way
    # to say which one the image carries, and was worse than useless: 'absent' matches on that
    # shared name and ignores the pin, so it removed the version we wanted, which the pinned role
    # then reinstalled -- every run, forever. The pin already does the job. A host carrying any
    # other Node reads as 'newer' or 'older' against this pin and converges onto it.
    #region ------ [ Roles: Nodejs 22 ] ----------------------------------------------------------------- #
    - role: 'nodejs_22'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        nodejs_22:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '22.23.2.0'
            sha256: 'ce9572ae220c345fbae2340bbb4d084e8ca5e0fe093ee7067d43094ae23be989'
    #endregion --- [ Roles: Nodejs 22 ] ----------------------------------------------------------------- #

    #region ------ [ Roles: Mozilla Firefox Esr ] ------------------------------------------------------- #
    - role: 'mozilla_firefox_esr'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        mozilla_firefox_esr:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '140.15.0.0'
            sha256: 'ef17e2f7ec5186c837ac53bd647f00ba89e8865f9851d01769d302f80f977397'
          # The baseline this image bakes in. Written as machine state so it survives capture;
          # a production GPO managing the same product later still wins on precedence.
          policy:
            overlays: [ 'stig' ]
    #endregion --- [ Roles: Mozilla Firefox Esr ] ------------------------------------------------------- #

    #region ------ [ Roles: Windows Exporter ] ---------------------------------------------------------- #
    - role: 'windows_exporter'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        windows_exporter:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '0.31.8.0'
            sha256: '0aadce6afb20182b678bfca9e8f2e8464ef48c469b28b4cf02e99d82158f5d40'
    #endregion --- [ Roles: Windows Exporter ] ---------------------------------------------------------- #

    #region ------ [ Roles: Microsoft Edge ] ------------------------------------------------------------ #
    - role: 'microsoft_edge'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        microsoft_edge:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '152.0.4191.53'
            sha256: '17b704410ae47e33f830230503affed39ba8ed36356e90f0cf6759231543a22c'
          # The baseline this image bakes in. Written as machine state so it survives capture;
          # a production GPO managing the same product later still wins on precedence.
          policy:
            overlays: [ 'stig' ]
    #endregion --- [ Roles: Microsoft Edge ] ------------------------------------------------------------ #

    #region ------ [ Roles: Putty ] --------------------------------------------------------------------- #
    - role: 'putty'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        putty:
          installer:
            bucket: "{{ aws_account_id }}-apprepo"
            version: '0.85.0.0'
            sha256: '2213ebacf962b709411d654a40087508a694756bc4e41c5a1c24ad86596b2511'
    #endregion --- [ Roles: Putty ] --------------------------------------------------------------------- #

    #region ------ [ Roles: Microsoft Openjdk 17 ] ------------------------------------------------------ #
    - role: 'microsoft_openjdk_17'
      when: (state | default('present') | string | lower | trim) != 'absent'
      vars:
        microsoft_openjdk_17:
          installer:
