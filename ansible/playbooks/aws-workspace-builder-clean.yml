# =========================================================================================== #
# File: 'ansible/playbooks/aws-workspace-builder-clean.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# REHEARSES CAPTURE PREPARATION. The build playbook leaves a working desktop; this one gives up
# the state that must not be captured. AWS's Image Checker refuses a capture whose services are in
# the state a running desktop needs, so this is done deliberately, in a run of its own, after the
# build has been proven.
#
# WHAT THIS PLAYBOOK IS FOR, AND WHAT IT IS NOT. CreateWorkspaceImage takes a WorkspaceId; it
# cannot capture an EC2 instance, and the stand-in carries none of the WorkSpaces agents a real
# desktop has. So running this against the stand-in does not produce an image and is not meant to:
# it proves the preparation is correct and idempotent, cheaply, on a machine we can destroy. The
# same playbook is what runs against a real WorkSpace, where the capture actually happens.
#
# That split is the whole method of this repository. Where a behaviour can be proven on EC2, it is
# proven there before it is trusted. Where it cannot -- anything that needs the WorkSpaces agents,
# the management interface, or the service's own capture path -- the code is written from AWS's
# documentation and is marked as documentation-derived rather than proven, so nobody mistakes a
# careful reading for a passing test.
#
# WHY A SEPARATE PLAYBOOK RATHER THAN A FLAG ON THE BUILD. The clean state is destructive to the
# running machine's usefulness: it stops the agent that manages it. Running it as part of the
# build would mean every converge ended with a half-crippled desktop, and re-running the build to
# fix something would silently undo the preparation. Two playbooks, run in order, keep both
# outcomes deliberate -- and make the build safely repeatable while a stand-in is being iterated.
#
# ONLY ROLES THAT IMPLEMENT 'clean' BELONG HERE. The loader resolves <state>_<os>.yml and fails
# loudly on a role that has no clean_windows.yml, which is the correct behaviour: a role is
# listed here once it has decided what it must give up to be captured, and not before.
#
# Run it exactly like the build playbook, with COMPOSE_PLAYBOOK naming this file. The build's
# proof should be green first: a machine that could not be converged should not be captured.
#
# =========================================================================================== #
---
#region ------ [ Play: What This Run Is, And What It Is Preparing ] ---------------------------- #
# Read before anything is given up. The state guard belongs here because it refuses the whole run;
# the identity is read here because the move below happens on a domain controller, which cannot
# ask the guest what the directory calls it -- and because after this the guest gets restarted,
# and a name read from a machine mid-restart is a name read from nothing.

- name: 'PLAY | Read What The Capture Needs To Know'
  hosts: 'workspace_servers'
  any_errors_fatal: true

  #region ------ [ Tasks ] -------------------------------------------------------------------- #
  tasks:

    # EXTRA VARS OUTRANK EVERYTHING, INCLUDING THE STATE EACH ROLE BELOW ASKS FOR. The roles here
    # request 'clean' as a role parameter, and a '-e state=present' copied from the build
    # playbook's invocation would silently outrank all of them -- turning a capture preparation
    # into an install run, on the machine about to be captured, with nothing in the output saying
    # so. Refusing is the only safe answer: this playbook has exactly one state.
    - name: 'PRE | Refuse A State Passed On The Command Line'
      ansible.builtin.assert:
        fail_msg: >-
          This playbook prepares a host for capture and takes no 'state' on the command line;
          each role below requests 'clean' itself. An extra variable outranks a role parameter,
          so '-e state={{ state | default('') }}' would override every one of them. Re-run
          without it.
        quiet: true
        that: [ state is not defined or (state | string | lower | trim) == 'clean' ]

    # THE NAME THE DIRECTORY KNOWS THIS MACHINE BY, read here because this is the play that has
    # the guest. The move below happens on a domain controller, which cannot ask. Taken from the
    # machine itself rather than from ansible_facts: this playbook does not gather facts, and the
    # inventory hostname is the Name tag, which after the bootstrap rename is not what the
    # directory calls it.
    - name: 'PRE | Read The Name The Directory Knows This Host By'
      changed_when: false
      register: '__capture_identity__'

      ansible.windows.win_powershell:
        depth: 2
        error_action: 'stop'
        script: |
          $Ansible.Changed = $False
          $Ansible.Result = @{ netbios = [System.String]$env:COMPUTERNAME }


  #endregion --- [ Tasks ] -------------------------------------------------------------------- #

#endregion --- [ Play: What This Run Is, And What It Is Preparing ] --------------------------- #

#region ------ [ Play: Move The Machine Out Of Reach Of The Build Policy ] -------------------- #
# THE LAST THING DONE BEFORE CAPTURE, AND IT HAPPENS IN THE DIRECTORY. Everything above gives up
# state that lives on the machine. This gives up the state that does not: the Group Policy the
# build linked to the OU the stand-in was born into -- the WinRM listener, the remote-token
# relaxation, the logon-right edits -- all of which are in effect right up until the object moves.
#
# AWS asks that a source machine carry no GPOs before an image is created, because policy can
# interfere with the RDP certificate handling and with Sysprep. Moving ONE computer object into an
# OU that blocks inheritance and has nothing linked to it reaches that state without unlinking a
# policy that other machines still need -- which is the difference between preparing a capture and
# breaking a directory.
#
# The move is on the DC because that is where the object is. The refresh and the proof are on the
# guest, because whether policy still applies is a fact about the machine, not about the directory.

- name: 'PLAY | Move The Stand-In Into The Capture OU'
  hosts: 'domain_controllers'
  any_errors_fatal: true
  run_once: true

  #region ------ [ Tasks ] -------------------------------------------------------------------- #
  tasks:

    # Identity comes from the guest, which knows what the directory calls it: the inventory
    # hostname is the Name tag, and an EC2 instance renamed during bootstrap does not answer to it.
    - name: 'CAPTURE | Move The Computer Object Out Of The Build OU'
      register: '__capture_move__'
      changed_when: '__capture_move__.result.moved | default(false) | bool'
      vars:
        __identity__: >-
          {{ hostvars[groups['workspace_servers'] | first]['__capture_identity__'].result.netbios }}

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          Identity: "{{ __identity__ }}"
          TargetOu: "{{ workspace_capture_ou }}"
        script: |
          [CmdletBinding()]
          Param ([System.String]$Identity, [System.String]$TargetOu)
          $Computer = Get-ADComputer -Identity:$Identity
          $Parent = ($Computer.DistinguishedName -split ',', 2)[1]
          $Moved = $False
          If ($Parent -ne $TargetOu) {
            $Null = Move-ADObject -Identity:$Computer.DistinguishedName -TargetPath:$TargetOu
            $Moved = $True
          }
          $Ansible.Changed = $Moved
          $Ansible.Result = @{ moved = $Moved; from = $Parent; to = $TargetOu }

  #endregion --- [ Tasks ] -------------------------------------------------------------------- #

#endregion --- [ Play: Move The Machine Out Of Reach Of The Build Policy ] -------------------- #

#region ------ [ Play: Prove The Build Policy No Longer Applies ] ----------------------------- #
# A move the machine has not noticed is not a move. Group Policy is cached until it refreshes, so
# the guest is told to refresh and then asked what it is actually carrying -- because the thing
# being captured is the machine's state, not the directory's intent.

- name: 'PLAY | Prove The Guest Carries No Build Policy'
  hosts: 'workspace_servers'
  any_errors_fatal: true

  #region ------ [ Tasks ] -------------------------------------------------------------------- #
  tasks:

    # A MOVE THE MACHINE HAS NOT NOTICED IS NOT A MOVE, AND gpupdate ALONE CANNOT NOTICE THIS ONE.
    # Group Policy scopes on where the computer object sits, and the client works from its own
    # cached placement -- so after the object moves, a refresh in the same boot re-applies the
    # policy of the OU it thinks it is still in. Proven here rather than assumed: the first run of
    # this play refreshed and found the build's WinRM and remote-token keys exactly where they
    # were.
    #
    # The reboot is what makes the machine read its own placement again. It is also wanted for its
    # own sake -- the Image Checker refuses a capture with a reboot pending, and this is the last
    # thing that would have caused one.
    - name: 'CAPTURE | Reboot So The Guest Reads Its New Placement'
      when: >-
        hostvars[groups['domain_controllers'] | first]['__capture_move__'].result.moved
        | default(false) | bool

      ansible.windows.win_reboot:
        boot_time_command: >-
          (Get-CimInstance -ClassName Win32_OperatingSystem -Property
          LastBootUpTime).LastBootUpTime.ToFileTime()
        msg: 'Restarting so Group Policy re-scopes to the capture OU.'
        post_reboot_delay: 15
        pre_reboot_delay: 2
        reboot_timeout: 900

    # THE GUEST'S ONLY ROUTE TO THE DIRECTORY COMES UP AFTER BOOT, NOT WITH IT. This machine
    # reaches the domain controller through a tunnel a service establishes once Windows is
    # already running, so for the first stretch after a restart the host is up, reachable over
    # SSH, and has no domain at all. A refresh in that window cannot contact a controller, quietly
    # re-applies nothing, and leaves the policy exactly where it was -- which is precisely what
    # the first attempt at this play did, and why its proof then failed on residue that a working
    # refresh would have cleared.
    #
    # Waited on the port that answers only when the tunnel is up, so the refresh below runs
    # against a directory that is actually there.
    # REACHABLE IS NOT THE SAME AS USABLE, and the difference cost a run to find. Waiting for the
    # controller's LDAP port to answer proves the tunnel is up; it says nothing about whether this
    # machine can yet AUTHENTICATE to the directory. A refresh in that gap reports success, does
    # nothing, and leaves the policy in place -- so the proof below failed on residue while the
    # move itself had been correct all along.
    #
    # What is waited on instead is the locator, which only answers once the machine can find a
    # controller for its own domain and talk to it as itself.
    - name: 'CAPTURE | Wait Until The Guest Can Actually Use The Directory'
      when: >-
        hostvars[groups['domain_controllers'] | first]['__capture_move__'].result.moved
        | default(false) | bool

      register: '__capture_locator__'
      retries: 30
      delay: 10
      until: __capture_locator__.result.usable | default(false) | bool
      changed_when: false

      ansible.windows.win_powershell:
        depth: 2
        error_action: 'stop'
        script: |
          $Located = $False
          & nltest ('/dsgetdc:' + $env:USERDNSDOMAIN) *>$null
          If ($LASTEXITCODE -eq 0) {
            Try { $Located = [System.Boolean](Test-ComputerSecureChannel -ErrorAction:'Stop') } Catch { $Located = $False }
          }
          $Ansible.Changed = $False
          $Ansible.Result = @{ usable = $Located }

    - name: 'CAPTURE | Refresh Policy Now That The Object Has Moved'
      changed_when: true
      when: >-
        hostvars[groups['domain_controllers'] | first]['__capture_move__'].result.moved
        | default(false) | bool

      ansible.windows.win_shell: 'gpupdate /force /wait:120'

    # The build's own policy keys are what this looks for, by name. A machine that still has them
    # after the move and the refresh is one whose policy has not caught up -- and capturing it
    # would bake a WinRM listener and a relaxed remote-token policy into every desktop built from
    # the image.
    - name: 'CAPTURE | Read The Policy The Guest Still Carries'
      register: '__capture_policy__'

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        script: |
          $WinRm = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service'
          $System = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
          $Residue = [System.Collections.Generic.List[System.String]]::new()
          If (Test-Path -LiteralPath:$WinRm) {
            $Item = Get-ItemProperty -LiteralPath:$WinRm -ErrorAction:'SilentlyContinue'
            If ($Null -ne $Item -and $Null -ne $Item.PSObject.Properties['AllowAutoConfig']) {
              $Residue.Add('WinRM AllowAutoConfig')
            }
          }
          If (Test-Path -LiteralPath:$System) {
            $Item = Get-ItemProperty -LiteralPath:$System -ErrorAction:'SilentlyContinue'
            If ($Null -ne $Item -and $Null -ne $Item.PSObject.Properties['LocalAccountTokenFilterPolicy']) {
              $Residue.Add('LocalAccountTokenFilterPolicy')
            }
          }
          # NOT NAMED 'clear'. Jinja resolves result.clear to the DICTIONARY'S OWN .clear method
          # rather than to this key, so the assertion below read a method object instead of a
          # boolean and failed against a machine that was entirely correct. The same collision
          # waits on values, keys, items, get, copy, update and pop.
          $Ansible.Changed = $False
          $Ansible.Result = @{ residue = $Residue.ToArray(); is_clear = ($Residue.Count -eq 0) }

    - name: 'CAPTURE | Prove No Build Policy Survives Into The Image'
      ansible.builtin.assert:
        fail_msg: >-
          The guest still carries build policy after the move and refresh:
          {{ __capture_policy__.result.residue | default([]) | join(', ') }}. Capturing now would
          bake it into every desktop built from this image. Confirm the computer object is in
          {{ workspace_capture_ou }}, that the OU blocks inheritance, and that no policy above it
          is ENFORCED -- an enforced link applies through a block.
        quiet: true
        that: [ __capture_policy__.result.is_clear | default(false) | bool ]

  #endregion --- [ Tasks ] -------------------------------------------------------------------- #

#endregion --- [ Play: Prove The Build Policy No Longer Applies ] ----------------------------- #

#region ------ [ Play: Give Up What Must Not Be Captured ] ------------------------------------ #
# LAST, AND THAT ORDER IS THE WHOLE POINT. Anything that starts itself at boot comes back after a
# restart: the forwarder is installed with an automatic start type, so a reboot between its clean
# state and the capture restarts it and it writes a fresh per-instance identity -- which is the
# one thing its clean state exists to prevent. Running these states after the reboot above means
# nothing gets the chance to undo them.
#
# It was in the wrong place first, and the machine said so: a second run found the forwarder
# running again with a new instance.cfg, because the reboot that re-scopes Group Policy had come
# after these states rather than before them.

- name: 'PLAY | Prepare The Stand-In For Image Capture'
  hosts: 'workspace_servers'
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: Splunk Universal Forwarder ] -------------------------------------- #
    # The forwarder must not carry a per-instance identity into the image. Its present state
    # avoids creating one (LAUNCHSPLUNK=0), but install-time properties only apply AT INSTALL --
    # a host that already had the forwarder keeps whatever it was installed with -- so the
    # identity is removed here, where the state of the machine is what is checked rather than
    # the intent of an install that may never have run.
    - role: 'splunk_universalforwarder'
      vars:
        state: 'clean'
    #endregion --- [ Roles: Splunk Universal Forwarder ] -------------------------------------- #

    #region ------ [ Roles: Amazon SSM Agent ] ------------------------------------------------ #
    # "Amazon SSM Agent must be disabled -- The Create Image process requires the Amazon SSM
    # Agent service to be disabled." The agent stays installed and ships with the image; what
    # must not survive capture is a running one, whose registration is instance-specific.
    - role: 'amazon_ssm_agent'
      vars:
        state: 'clean'
    #endregion --- [ Roles: Amazon SSM Agent ] ------------------------------------------------ #
    #region ------ [ Roles: Workspace Capture Readiness ] ------------------------------------- #
    # LAST, because it is the verdict. Everything above gives something up; this runs the
    # capture-only remediation and then asks whether the machine would actually be accepted --
    # our own pre-checks everywhere, and AWS's own validation wherever its agent provides it.
    - role: 'workspace_capture_readiness'
      vars:
        state: 'clean'
        workspace_capture_readiness:
          checker:
            bucket: "{{ aws_account_id }}-apprepo"
    #endregion --- [ Roles: Workspace Capture Readiness ] ------------------------------------- #


  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Give Up What Must Not Be Captured ] ------------------------------------ #
