#
# Windows-family overlay merged over laps_credential_defaults by the v3 loader.
#
# Windows LAPS is a Windows-only feature read through a Windows-only cmdlet on a Windows domain
# controller, so the defaults are already the Windows values and this overlay carries nothing. It
# exists because the loader resolves an OS overlay per family; an empty map is the honest
# statement that this family needs no override, rather than a duplicate of defaults that would
# drift.
