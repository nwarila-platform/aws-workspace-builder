# ============================================================================================= #
# File: '{{ role_path }}/tasks/present_windows.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Waits for Active Directory to escrow the Windows LAPS credential for one computer, and publishes
# it to the play through the registered result.
#
# THIS RUNS ON A DOMAIN CONTROLLER. Get-LapsADPassword reads the directory, so the read happens
# where the directory is; the guest is not contacted at all, and does not have to be reachable —
# which is the whole reason this role exists, because at the moment it runs the guest is reachable
# by nothing else.
#
# NOTHING HERE TRIGGERS THE ESCROW. The LAPS policy arrives by Group Policy and Windows LAPS
# processes it on its own background cycle, so the credential appears when the guest gets round
# to it. Waiting is the entire job, and the budget in defaults is what bounds it.
#
# 'not yet escrowed' is a STATE, not an error: the script reports it as a result and the 'until'
# below is what turns it into a wait. Only an identity the directory does not know at all is a
# hard failure, because no amount of waiting fixes a machine that was never joined.
#
# THE READ IS no_log AND STAYS THAT WAY. A LAPS password is the credential for the built-in
# Administrator of a domain-joined machine; it may not appear in a log, a retry line, a callback
# or a job artifact. The cost is that the wait is silent — 'until' reports nothing under no_log —
# which is why the task name states the budget and END reports the metadata afterwards.
#
# ============================================================================================= #
---
#region ------ [ Begin: Wait For The Escrow ] ------------------------------------------------- #

- name: 'BEGIN | Wait For The Directory To Escrow The Credential'

  # Begin The 'Begin' Block
  block:

    #region ------ [ Begin: Poll The Computer Object ] ---------------------------------------- #
    # Parameters cross as typed module options, never Jinja spliced into the script source, which
    # is what keeps the injection surface at zero. No changed_when: the script sets
    # $Ansible.Changed false itself, because reading a directory changes nothing. The referenced
    # .ps1 is MATERIALIZED from scripts/ by scripts/materialize-role-scripts.sh (the role tracks
    # only files/Get-LapsCredential.ps1.stub); run it before this role.
    #
    # This task is SILENT BY DESIGN. Under no_log Ansible prints neither the attempts nor the
    # result, so a long wait looks like a stalled task; it is not. The budget is in the name.

    - name: >-
        BEGIN | Poll For The Escrowed Credential, Budget {{
        laps_credential_running.wait.attempts ~ ' attempts x '
        ~ laps_credential_running.wait.delay_seconds ~ 's' }}
      delay: "{{ laps_credential_running.wait.delay_seconds | int }}"
      no_log: true
      register: '__laps_credential_read__'
      retries: "{{ laps_credential_running.wait.attempts | int }}"
      # GUARDED, BECAUSE A FAILED ATTEMPT HAS NO RESULT. When the module fails, 'result' is null,
      # and an unguarded 'result.escrowed' raises instead of evaluating -- which ends the retry
      # loop with a conditional error, post-seal, while no_log replaces the module's real
      # exception with "the output has been hidden". A single transient error would abort the
      # whole wait, which is the opposite of what a budget of this size is for.
      until: (__laps_credential_read__.result | default({})).escrowed | default(false) | bool

      ansible.windows.win_powershell:
        depth: 3
        error_action: 'stop'
        parameters:
          Identity: "{{ laps_credential_running.identity }}"
          NotBefore: "{{ laps_credential_running.not_before }}"
        script: "{{ lookup('ansible.builtin.file', 'Get-LapsCredential.ps1') }}"

    #endregion --- [ Begin: Poll The Computer Object ] ---------------------------------------- #

#endregion --- [ Begin: Wait For The Escrow ] ------------------------------------------------- #


#region ------ [ End: Prove And Report The Escrow ] ------------------------------------------- #

- name: 'END | Prove And Report The Escrow'

  # Begin The 'End' Block
  block:

    #region ------ [ End: Prove The Credential Is Usable ] ------------------------------------ #
    # The 'until' above already proves escrowed is true, so this catches the remaining shape the
    # play depends on and the loop does not: an escrow that carries a password but names no
    # account is one the next play cannot log in with. Asserted with no_log because the fail
    # message would otherwise be free to render the result it is complaining about.

    - name: 'END | Prove The Escrow Names An Account To Log In As'
      no_log: true

      ansible.builtin.assert:
        fail_msg: >-
          The directory escrowed a credential for
          {{ laps_credential_running.identity }} but named no account to use it with. The next
          play logs in as that account, so there is nothing to continue with.
        quiet: true
        that:
          - __laps_credential_read__.result.escrowed | bool
          - __laps_credential_read__.result.account | default('') | length > 0

    #endregion --- [ End: Prove The Credential Is Usable ] ------------------------------------ #

    #region ------ [ End: Report What Was Read, Without The Credential ] ---------------------- #
    # The one thing this role is allowed to say out loud. Everything here is metadata a directory
    # administrator can read from the computer object anyway; the password is not among it, and
    # never leaves the registered result.

    - name: 'END | Report The Escrow Without The Credential'
      ansible.builtin.debug:
        msg: >-
          {{ laps_credential_running.identity }}: credential escrowed for account
          '{{ __laps_credential_read__.result.account }}', last set
          {{ __laps_credential_read__.result.password_updated_time | default('an unreported time') }},
          expiring {{ __laps_credential_read__.result.expiration_timestamp | default('at an unreported time') }}.
        verbosity: 0

    #endregion --- [ End: Report What Was Read, Without The Credential ] ---------------------- #

#endregion --- [ End: Prove And Report The Escrow ] ------------------------------------------- #
