# =========================================================================================== #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Lowest-precedence configuration for the adobe_acrobat_reader_dc role. The v3 loader merges the OS overlay in
# vars/ over this map and publishes the result as 'adobe_acrobat_reader_dc_running'; tasks read only the merged
# map, never these keys directly.
#
# This role follows THE CATALOG PATTERN google_chrome sets as the exemplar: an ARP identity, a
# staging location, a bounded install, and an artifact layout keyed by <version>. See that
# role's defaults for the full rationale; only the product values differ here.
#
# The deployment-specific inputs -- bucket, pinned version, digest -- are supplied by the
# PLAYBOOK, where they are visible and changeable. See meta/main.yml and tasks/validate.yml.
#
# =========================================================================================== #
---
adobe_acrobat_reader_dc_defaults:

  #region ------ [ Install ] ------------------------------------------------------------------ #

  install:
    # Staging directory on the guest. The installer is removed from here after execution. A site
    # whose application control trusts only named paths overrides this to one of them.
    staging_dir: 'C:\Windows\Temp\adobe-acrobat-reader-dc-install'

    # A wrong silent switch can leave the installer waiting on a dialog instead of returning.
    # Bounding it here fails the run inside Ansible rather than hanging the play.
    timeout_seconds: 1200

    # The vendor installer's silent switches. Part of the vendor artifact contract like the
    # object key above: they change only when the vendor changes installer technology.
    arguments: '/sAll /rs /msi EULA_ACCEPT=YES'

  #endregion --- [ Install ] ------------------------------------------------------------------ #

  #region ------ [ Product identity ] --------------------------------------------------------- #

  # Install state is read from Add/Remove Programs, not from the vendor's own key. The ARP entry
  # carries the version AND the install location, is a documented Windows contract rather than a
  # vendor implementation detail, and is removed on uninstall by definition.
  arp:
    display_name: 'Adobe Acrobat (64-bit)'

  #endregion --- [ Product identity ] --------------------------------------------------------- #

  #region ------ [ Enterprise policy ] -------------------------------------------------------- #
  # WHAT THIS PRODUCT CAN BE TOLD, AND WHICH OF IT THIS IMAGE SAYS. The role supports the
  # product's whole enterprise-policy surface: any value the vendor documents under the root
  # below can be set, in any registry type, including the numbered subkey lists the vendor uses
  # for blocklists and allowlists. Nothing about that mechanism is specific to one baseline.
  #
  # WHICH settings is a separate question, and its answer is an OVERLAY -- a named document under
  # files/policy/ holding a coherent set of them. 'stig' is one such set. A site with its own
  # baseline adds its own file beside it; overlays apply in the order named, so a later one
  # refines an earlier one rather than replacing it.
  #
  # The root is a fact about the product and lives here. WHICH overlays an image carries is a
  # deployment decision and comes from the playbook -- an image that hardens nothing is a
  # legitimate image, so the default is none.
  policy:
    root: 'HKLM:\SOFTWARE\Policies\Adobe\Acrobat Reader\DC\FeatureLockDown'
    overlays: []

  #endregion --- [ Enterprise policy ] -------------------------------------------------------- #

  #region ------ [ Installer layout ] --------------------------------------------------------- #

  # The application-repository object key, keyed by the pinned version the playbook supplies.
  # The vendor folder is named exactly as the product's ARP Publisher spells it, per the org
  # apprepo convention.
  installer:
    path: 'Adobe Systems Inc/Adobe Acrobat Reader DC/<version>/AcroRdrDCx642600121789_MUI.exe'

  #endregion --- [ Installer layout ] --------------------------------------------------------- #
