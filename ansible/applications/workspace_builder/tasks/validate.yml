# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Validates the merged workspace_builder configuration after the v3 loader merge, on the
# CONTROLLER, before anything touches the guest. The workspace and identity inputs are supplied
# by the playbook rather than defaulted, so this is where a missing or malformed one is caught —
# in a second, rather than mid-converge at the cost of an instance.
#
# meta/main.yml describes these inputs; this file is what enforces them.
#
# =========================================================================================== #
---
- name: 'VALIDATE | Require The Production Workspace This Host Stands In For'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - workspace_builder_running.workspace.directory_id | default('') is match('^d-[0-9a-z]{8,}$')
      - workspace_builder_running.workspace.bundle_id | default('') is match('^wsb-[0-9a-z]+$')
      - workspace_builder_running.workspace.user_name | default('') | length > 0
    fail_msg: >-
      Refusing to record the stand-in: the playbook must name the production WorkSpace this host
      mirrors — a 'd-...' directory id, a 'wsb-...' bundle id, and the WorkSpace user name the
      reference flow feeds to create-workspaces. See meta/main.yml.
    quiet: true

- name: 'VALIDATE | Require The Stand-In Identity From This Run''s Inventory'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - workspace_builder_running.identity.workspace_id | default('') is match('^i-[0-9a-f]+$')
      - workspace_builder_running.identity.computer_name | default('') is match('^[A-Za-z0-9][A-Za-z0-9-]{0,62}$')
      - workspace_builder_running.identity.image_id | default('') is match('^ami-[0-9a-f]+$')
      - workspace_builder_running.identity.private_ip | default('')
        is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
    fail_msg: >-
      Refusing to record the stand-in: identity must come from the run's own inventory — an EC2
      instance id standing in for the WorkSpace id, a hostname-shaped computer name, the launch
      image id, and the private IPv4. An empty or malformed value here means the playbook did not
      pass the aws_* hostvars through. See meta/main.yml.
    quiet: true

- name: 'VALIDATE | Require A Rooted Manifest Location'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - workspace_builder_running.manifest.directory | default('') is match('^[A-Za-z]:\\\\')
      - workspace_builder_running.manifest.filename | default('') is match('^[A-Za-z0-9._-]+$')
    fail_msg: >-
      Refusing to write the manifest: manifest.directory must be an absolute, drive-letter-rooted
      Windows path and manifest.filename a bare file name with no path separators. See
      meta/main.yml.
    quiet: true
