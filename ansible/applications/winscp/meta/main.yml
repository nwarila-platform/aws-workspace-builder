# =========================================================================================== #
# File: '{{ role_path }}/meta/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
# Role metadata for winscp. Description-only (style guide 8): NOT an enforcing argument
# spec. The role's tasks/validate.yml enforces its merged-config guards.
#
# REQUIRED INPUTS — declared empty in defaults and supplied by the playbook.
#
# These are deployment-specific: the installer bucket carries an account id, and the pinned
# version and digest change with every artifact drop. Concrete defaults would ship one site's
# values as if they were universally safe, so the playbook states them where a reader can see
# what is installed.
#
#   winscp.installer.bucket   S3 bucket holding the installer (the application repository).
#   winscp.installer.version  Four-part product version the installer delivers; the role
#                                    compares it against Add/Remove Programs to stay idempotent.
#   winscp.installer.sha256   Lowercase 64-character digest of that object. Verified on the
#                                    GUEST immediately before execution — the copy that runs.
#
# The controller resolves the artifact from S3. The guest is never given cloud credentials.
# =========================================================================================== #
---
galaxy_info:
  role_name: 'winscp'
  namespace: 'nwarila_platform'
  author: 'nwarila-platform'
  description: >-
    WinSCP installation for the Windows WorkSpace image, following the catalog pattern
    winscp sets as the exemplar. Fetches the pinned installer from S3 through the controller,
    verifies its digest on the guest before executing it, and installs silently. Idempotent on the
    product's Add/Remove Programs registration at or above the pinned version.
  license: 'MIT'
  min_ansible_version: '2.17'
  platforms:
    - name: 'Windows'
      versions:
        - '2022'
  galaxy_tags: ['windows', 'software']

dependencies: []
